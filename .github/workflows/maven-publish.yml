name: Publish package to the Maven Central Repository

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pick the JDK you actually build with; 17 is a safe default.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
          # Map Central credentials into ~/.m2/settings.xml <servers><server id="central">...
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          # Import your signing key for the maven-gpg-plugin
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      # Optional: if your build needs extra env vars (kept from your original)
      - name: Build & Publish to Central
        env:
          CP_CLIENT_ID: ${{ secrets.CP_CLIENT_ID }}
          CP_MERCHANT_ID: ${{ secrets.CP_MERCHANT_ID }}
          CP_LICENCE_KEY: ${{ secrets.CP_LICENCE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          # New Central credentials (Portal user token parts)
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          # If your POM profile handles signing, keep it:
          mvn -B -P sign-artifacts -DskipTests deploy
          # or, if signing is always on, this also works:
          # mvn -B -DskipTests deploy